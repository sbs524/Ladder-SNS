services:
  - type: web
    runtime: node
    name: ladder-sns
    branch: main
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    domains:
      - laddersns.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://laddersns.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # 이게 "true"가 아니면 startYoutubeSyncWorker()가 그냥 반환한다 — 지표가 영원히 갱신되지 않는다.
      - key: YOUTUBE_SYNC_WORKER_ENABLED
        value: "true"
      # 채널당 재동기화 주기(시간). 비우면 6시간.
      - key: YOUTUBE_SYNC_INTERVAL_HOURS
        value: "6"
